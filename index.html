<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}html{scroll-padding-top:calc(var(--kf-barra-h,60px) + env(safe-area-inset-top,0px))}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Conta Fácil</title>
<meta name="description" content="Divida a comanda sem calculadora">
<meta name="theme-color" content="#EAF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1712" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Conta Fácil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head><body class="kf-casca">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="comum/kit-facil.css">
<style>
/* Layout: coluna única estilo app de bolso; comanda de boteco (verde azulejo + chopp) e cupons em papel térmico */
:root{
  --bg:#EAF0EA; --surface:#FFFFFF; --surface-2:#F3F7F2; --line:#D2DCD3;
  --ink:#14241B; --muted:#56695D; --green:#1D5A3B; --green-ink:#FFFFFF; --green-soft:#DCEBE1;
  --mustard:#D3931A; --mustard-soft:#FBEFD2; --mustard-ink:#5A3D05; --danger:var(--kf-bad); --danger-soft:var(--kf-bad-soft);
  --paper:#FFFDF5; --paper-ink:#24221C; --paper-muted:#6E6858; --paper-line:#CFC7B2;
  --shadow:0 1px 2px rgba(20,36,27,.06),0 6px 18px rgba(20,36,27,.06);
  /* fontes do sistema de design comum (comum/kit-facil.css); o cupom usa uma fonte de impressora térmica */
  --f-display:var(--kf-font-display);
  --f-body:var(--kf-font);
  --f-mono:var(--kf-font-mono);
  --f-cupom:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1712; --surface:#15221B; --surface-2:#1B2B22; --line:#2A3E32;
  --ink:#E4EEE7; --muted:#92A799; --green:#46A272; --green-ink:#06120B; --green-soft:#1C3A2A;
  --mustard:#E9B24C; --mustard-soft:#3A2E15; --mustard-ink:#F6DDA6; --danger:var(--kf-bad); --danger-soft:var(--kf-bad-soft);
  --paper:#ECE6D6; --paper-ink:#1E1C17; --paper-muted:#5F5A4C; --paper-line:#B9B09A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1712; --surface:#15221B; --surface-2:#1B2B22; --line:#2A3E32;
  --ink:#E4EEE7; --muted:#92A799; --green:#46A272; --green-ink:#06120B; --green-soft:#1C3A2A;
  --mustard:#E9B24C; --mustard-soft:#3A2E15; --mustard-ink:#F6DDA6; --danger:var(--kf-bad); --danger-soft:var(--kf-bad-soft);
  --paper:#ECE6D6; --paper-ink:#1E1C17; --paper-muted:#5F5A4C; --paper-line:#B9B09A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,input,select,textarea,[role=button]{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{overflow-x:clip;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mustard);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* header */


section.view{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.banner{background:var(--mustard-soft);color:var(--mustard-ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner.warn{background:var(--danger-soft);color:var(--danger)}

/* fields */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input:not([type]){width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input,select,textarea{font-size:16px}
input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .grow{flex:1 1 180px}
.place-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}

.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700;background:var(--green);color:var(--green-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.mustard{background:var(--mustard);color:#2a1d02}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn.del:hover{color:var(--danger)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:44px}
.stepper button{border:0;background:none;width:38px;height:42px;font-size:18px;color:var(--muted)}
.stepper input{border:0!important;background:none!important;box-shadow:none!important;width:46px;text-align:center;padding:0;min-height:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:32px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--green-ink);box-shadow:none}
.chip.suggest{border:1px dashed var(--line);box-shadow:none;background:transparent}
.chip.suggest:hover{color:var(--ink);border-color:var(--green)}
.chip.all{background:transparent;box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}

/* people */
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 6px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.person span.n{font-weight:600}
.person button{border:0;background:none;width:26px;height:26px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.person button:hover{color:var(--danger);background:var(--danger-soft)}

/* items */
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.item.unassigned{border-color:var(--danger);border-style:dashed}
.item-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.item-name{font-weight:700;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.item-meta{color:var(--muted);font-size:13px}
.item-total{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.item-actions{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item-actions .grp{display:flex;gap:6px;align-items:center}
.share{font-size:12.5px;color:var(--muted)}

/* summary */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
@media (max-width:560px){.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.sum b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum.total{background:var(--green);color:var(--green-ink)}
.sum.total .eyebrow{color:inherit;opacity:.8}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--line);flex-wrap:wrap;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:600;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--mustard);outline-offset:2px}

.who{display:flex;flex-direction:column}
.who-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.who-row:first-child{border-top:0}
.who-name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.who-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-total{font-family:var(--f-mono);font-weight:600;text-align:right}
.who-sub{grid-column:1 / -1;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.policy-note{font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--muted)}
.policy-note b{color:var(--ink)}

/* receipts */
.receipts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;align-items:start}
.receipt-wrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.receipt{--zz:6px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-cupom);font-size:12.5px;line-height:19px;padding:16px 20px 20px;margin-block:var(--zz);position:relative;filter:drop-shadow(0 2px 5px rgba(0,0,0,.13))}
/* bordas serrilhadas de cupom de impressora térmica */
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:var(--zz);background-size:12px var(--zz);background-repeat:repeat-x}
.receipt::before{top:calc(-1 * var(--zz));background-image:conic-gradient(from 135deg at top,var(--paper) 90deg,#0000 0)}
.receipt::after{bottom:calc(-1 * var(--zz));background-image:conic-gradient(from -45deg at bottom,var(--paper) 90deg,#0000 0)}
.rc-brand{text-align:center;font-weight:600;font-size:14px;line-height:22px;letter-spacing:.02em}
.rc-center{text-align:center;line-height:18px}
.rc-center.rc-muted{font-size:12px}
.rc-small{font-size:11px!important;line-height:16px}
.receipt .rc-who{text-align:center;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:30px;letter-spacing:-.01em;margin-top:-2px}
.receipt hr{border:0;border-top:1px dashed var(--paper-ink);margin:6px 0 8px}
.rc-line{display:flex;justify-content:space-between;gap:12px}
.rc-line span:first-child{min-width:0;overflow-wrap:anywhere}
.rc-line span:last-child{white-space:nowrap}
.rc-detail{font-size:11px;line-height:15px;padding-left:8px}
.rc-total{font-weight:600;font-size:16px;line-height:26px;border-top:2px solid var(--paper-ink);padding-top:4px;margin-top:6px}
.rc-section{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:11px;line-height:12px;font-weight:600;letter-spacing:.16em}
.rc-section::before,.rc-section::after{content:"";flex:1;border-top:1px dashed var(--paper-ink)}
.rc-foot{text-align:center;font-size:11px;line-height:16px;margin-top:8px}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.hist-row:hover{box-shadow:inset 0 0 0 1px var(--green),var(--shadow)}
.hist-date{width:46px;text-align:center;background:var(--green-soft);color:var(--green);border-radius:10px;padding:6px 0;line-height:1.1}
.hist-date b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800}
.hist-date small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.hist-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-total{font-family:var(--f-mono);font-weight:600}

/* catalog */
.cat-list{display:flex;flex-direction:column}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0}
.cat-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cat-row input{width:110px;min-height:40px;padding:6px 10px;text-align:right;font-family:var(--f-mono)}

/* overlay */
.kf-dlg-pe .btn{flex:1 1 140px}
.kf-dlg-corpo h3{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.actions-bar{display:flex;gap:8px;flex-wrap:wrap}
.actions-bar .btn{flex:1 1 160px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* novas peças */
.status{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:13.5px}
.status svg{flex:none;margin-top:1px}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.warn{background:var(--mustard-soft);color:var(--mustard-ink)}
.status.bad{background:var(--danger-soft);color:var(--danger)}
.status b{font-weight:700}
.transfers{display:flex;flex-direction:column;gap:6px}
.transfer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.transfer .who{display:flex;flex-direction:row;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;font-weight:600}
.transfer .arrow{color:var(--muted);font-weight:400}
.transfer .v{font-family:var(--f-mono);font-weight:600}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;font-weight:600}
.part button{border:0;background:var(--surface);width:26px;height:26px;border-radius:50%;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.part .pv{font-family:var(--f-mono);color:var(--muted);font-weight:400;font-size:12px}
.item.free .item-total{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 6px;background:var(--mustard-soft);color:var(--mustard-ink);margin-left:6px;vertical-align:2px}
.mini-toggle{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 6px;border-radius:6px;min-height:30px}
.mini-toggle[aria-pressed="true"]{color:var(--green);background:var(--green-soft)}
.mini-toggle:hover{color:var(--ink)}
.join{display:flex;flex-direction:column;gap:8px}
.chip.me{box-shadow:inset 0 0 0 2px var(--mustard)}
.chip[aria-pressed="true"].me{box-shadow:inset 0 0 0 2px var(--mustard)}
.item.open{border:1.5px solid var(--mustard);background:var(--surface);box-shadow:0 0 0 4px var(--mustard-soft)}
.item.locked{background:var(--surface-2)}
.lock-sum{display:flex;gap:8px;align-items:flex-start;font-size:14px;overflow-wrap:anywhere}
.lock-sum svg{flex:none;color:var(--green);margin-top:1px}
.units{display:flex;flex-direction:column;gap:2px}
.unit-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.unit-row:first-child{border-top:0}
.unit-row .uv{text-align:right;color:var(--muted);font-size:13px}
.unit-row.on .uv{color:var(--ink)}
.unit-row:not(.on) .who-name{color:var(--muted);font-weight:500}
.stepper.sm{min-height:36px}
.stepper.sm button{height:34px;width:36px}
.stepper.sm button:disabled{opacity:.3;cursor:not-allowed}
.stepper.sm .num{min-width:28px;text-align:center;font-weight:600}
.unit-count{display:flex;align-items:center;gap:6px;min-width:52px;justify-content:flex-end;font-weight:700;font-size:16px}
.delta{font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:6px;padding:1px 5px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--danger-soft);color:var(--danger)}
.unit-btns{display:flex;align-items:center;gap:6px}
.unit-btns button{border:0;border-radius:9px;min-width:44px;height:36px;font-weight:700;font-family:var(--f-mono);font-size:13.5px}
.unit-btns .plus{background:var(--green);color:var(--green-ink)}
.unit-btns .minus{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.unit-btns button:disabled{opacity:.3;cursor:not-allowed}
.pending-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--mustard-soft);color:var(--mustard-ink);border-radius:10px;padding:8px 8px 8px 12px;font-size:13.5px}
.pending-bar .grp{display:flex;gap:6px}
.item.dirty{border-color:var(--mustard)}
.chip.changed{outline:2px dashed var(--mustard);outline-offset:1px}
.free-row{grid-template-columns:minmax(0,1fr) auto}
.fq-count{min-width:48px;text-align:center;font-weight:700;font-size:16px}
.fq-count small{color:var(--muted);font-weight:400;font-size:12px}
.hero{background:var(--green);color:var(--green-ink);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero-greet{margin:0;font-size:14px;opacity:.85}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.start-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.start-row input{flex:1 1 200px;background:var(--surface);color:var(--ink);border:0;border-radius:10px;padding:10px 12px;min-height:46px}
.start-row .btn{flex:none;min-height:46px}
.hero-chips .chip{background:rgba(255,255,255,.14);color:var(--green-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.hero-link{border:0;background:none;color:var(--green-ink);text-align:left;padding:0;font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.card.current{box-shadow:inset 0 0 0 2px var(--mustard),var(--shadow)}
.cur-total{font-family:var(--f-mono);font-weight:600;font-size:20px}
.example-link{border:0;text-align:left;flex-direction:row;align-items:center;justify-content:space-between;cursor:pointer;color:var(--ink)}
.example-link > span:first-child{display:flex;flex-direction:column;gap:2px}
.mini-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mini-stats b{color:var(--ink)}
.reset-btn{align-self:center;color:var(--muted)}
.reset-opts{display:flex;flex-direction:column;gap:8px}
.reset-opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.reset-opt span{color:var(--muted);font-size:13px}
.reset-opt.danger b{color:var(--danger)}
.reset-opt:hover{border-color:var(--green)}
.reset-opt.danger{border-color:var(--danger-soft)}
.reset-opt.danger:hover{border-color:var(--danger)}
.price-hint{margin:0;font-size:12.5px;color:var(--green)}
.price-hint.other{color:var(--mustard-ink);background:var(--mustard-soft);border-radius:8px;padding:6px 10px}
.prod-list{display:flex;flex-direction:column}
.prod{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.prod:first-child{border-top:0}
.prod-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prod-head .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.prod-head .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center;padding-left:10px}
.price-row .pl{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-row input{min-height:40px;padding:6px 10px;text-align:right;font-family:var(--f-mono)}
.share-prev{display:flex;justify-content:center;background:var(--surface-2);border-radius:12px;padding:8px;min-height:120px;align-items:center}
.share-prev img{max-width:min(100%,360px);height:auto;border-radius:6px;-webkit-touch-callout:default}
.card-head .grp{display:flex;gap:6px;flex-wrap:wrap}
.share-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.share-btn{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:13.5px;color:var(--ink);padding:8px 4px}
.share-btn svg{width:22px;height:22px;color:var(--green)}
.share-btn:hover{box-shadow:inset 0 0 0 1.5px var(--green)}
.share-btn:disabled{opacity:.5}
[hidden]{display:none!important}
.recover{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.recover > span{flex:1 1 220px;min-width:0}
.rec-list{display:flex;flex-direction:column}
.rec-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rec-row:first-child{border-top:0}
.rec-row input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green)}
.rec-row b{display:block;overflow-wrap:anywhere}
.rec-row small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.btn.danger-text{color:var(--danger)}
.hero-chips .chip[aria-pressed="true"]{background:var(--mustard);color:#2a1d02;box-shadow:none}
.sum.total{grid-column:1 / -1;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sum.total b{font-size:20px}
.rc-sub{font-weight:600;font-size:13px;line-height:20px}
.who-row.covered .who-total{color:var(--muted)}
.paid-tag{color:var(--green);font-weight:700}
.kf-dlg .settle{box-shadow:none;border:1px solid var(--line)}
.hist-total{display:flex;flex-direction:column;align-items:flex-end}
.gboard{display:flex;flex-direction:column;gap:10px}
.pay-t{border:0;border-radius:99px;font-size:11.5px;font-weight:700;padding:4px 8px;min-height:28px;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pay-t[aria-pressed="true"]{background:var(--mustard);color:#2a1d02;box-shadow:none}
.drop-on{box-shadow:0 0 0 3px var(--mustard)}
.drag-ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:1.5px solid var(--mustard);border-radius:99px;padding:5px 14px 5px 5px;box-shadow:0 14px 30px rgba(0,0,0,.28);animation:dg-in .18s cubic-bezier(.2,.8,.2,1)}
@keyframes dg-in{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
.dg-avs{display:flex;padding-left:6px;flex:none}
.dg-avs .avatar{width:30px;height:30px;margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.dg-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.drag-ghost b{font-size:14px;white-space:nowrap}
body.is-dragging{user-select:none;-webkit-user-select:none}
.pick-hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--mustard-soft);color:var(--mustard-ink);border-radius:10px;padding:8px 10px;font-size:13.5px}
.pick-hint > span{flex:1 1 180px}
.sg-wrap{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.start-row .sg-wrap{flex:1 1 200px}
.sg-box{position:static;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}
.sg-item{border:0;background:none;text-align:left;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;color:var(--ink);min-height:44px;border-top:1px solid var(--line)}
.sg-item:first-child{border-top:0}
.sg-item small{font-family:var(--f-mono);font-weight:500;color:var(--green);font-size:12.5px;white-space:nowrap}
.sg-item small.dim{color:var(--muted)}
.sg-item.on,.sg-item:hover{background:var(--surface-2)}
.sg-wrap input{width:100%}
.start-row .sg-wrap > input{flex:none}
.pix-row{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr);gap:8px;align-items:center}
.pix-row label{font-weight:600;font-size:13.5px}
.pix-row input{min-height:40px;font-size:16px}
.adj{display:flex;flex-direction:column;gap:8px;padding:2px 4px}
.adj-btns{display:flex;flex-wrap:wrap;gap:8px}
.adj-btn{border:1.5px dashed var(--line);background:transparent;border-radius:99px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.adj-btn svg{width:16px;height:16px;color:var(--green)}
.adj-btn:hover{border-color:var(--green)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;background:#FFFFFF;border-radius:12px;padding:12px}
.qr-wrap canvas{width:min(240px,70vw);height:auto;image-rendering:pixelated}
.pix-code{width:100%;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;word-break:break-all}
.pix-btn{min-height:32px;padding:4px 10px}
.pay-card{gap:14px}
.pay-t{white-space:nowrap}
.cv-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px}
.cv-row label{font-weight:600}
.cv-row .hint{grid-column:1/-1}
.cv-row input{min-height:40px;font-size:16px;font-family:var(--f-mono)}
.ubox-list{display:flex;flex-direction:column;gap:10px}
.ubox{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface);transition:box-shadow .12s}
.ubox.group{border:1.5px solid var(--green);background:var(--green-soft)}
.ubox-tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.urow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px}
.urow.recv{color:var(--green)}
.ubox .pix-row{grid-template-columns:auto minmax(0,1fr)}
.drop-out{display:none;border:1.5px dashed var(--danger);color:var(--danger);border-radius:12px;padding:14px;justify-content:center;font-weight:600;font-size:13.5px}
body.is-dragging.drag-out .drop-out{display:flex}
.me-name{box-shadow:inset 0 -2px 0 var(--mustard)}

/* estatísticas */
.stats-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.stats-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:22px;border-bottom:1px solid var(--line)}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;outline:none}
.bar{width:min(42px,70%);background:var(--green);border-radius:4px 4px 0 0;min-height:2px;transition:filter .15s}
.bar.zero{background:var(--line)}
.bar-col:hover .bar,.bar-col:focus-visible .bar{filter:brightness(1.12)}
.bar-val{position:absolute;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;transform:translateY(-4px)}
.bar-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:2;font-family:var(--f-mono)}
.bar-col:first-child .bar-tip{left:0;transform:none}
.bar-col:last-child .bar-tip,.bar-col:nth-last-child(2) .bar-tip{left:auto;right:0;transform:none}
.bar-col:hover .bar-tip,.bar-col:focus-visible .bar-tip{opacity:1}
.chart-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:12px;color:var(--muted);text-align:center;padding-top:6px;text-transform:capitalize}
.rank{display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.rank-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0}
.rank-row .nm span{overflow:hidden;text-overflow:ellipsis}
.rank-row .vl{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.rank-row .track2{grid-column:1 / -1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.rank-row .fill{height:100%;background:var(--mustard);border-radius:99px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.me-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me-pick select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}

/* botões lado a lado sempre dividem a linha em partes iguais */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%}
.seg button{white-space:normal;line-height:1.2;text-align:center}
.chips{display:flex;flex-wrap:wrap}
.chips .chip{flex:1 1 56px;justify-content:center;min-width:0;padding-inline:8px}
.urow > span:first-child{flex:1 1 0;min-width:0}
.btn-row,.item-actions .grp,.pending-bar .grp,.adj-btns,.sheet-actions{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;width:100%}
.sheet-actions{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.adj-btns{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.adj-btn{justify-content:center}
.item-actions{flex-direction:column;align-items:stretch}
.pending-bar{flex-direction:column;align-items:stretch}
.del-btn{color:var(--danger)}
.cat-row > .btn,.cat-row > .icon-btn{width:52px;height:40px;min-height:40px;padding:0}
.cover-row{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.sg-wrap > .sg-clear{position:absolute;right:6px;top:7px;width:34px;height:34px;border:0;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;padding:0}
.sg-wrap > .sg-clear svg{width:16px;height:16px}
.sg-wrap > .sg-clear[hidden]{display:none}
#item-name{padding-right:46px}
.btn,.adj-btn{white-space:nowrap}
.btn svg,.adj-btn svg,.chip svg{flex:none}
.actions-bar{display:grid;grid-template-columns:1fr;gap:8px}
.btn-row .btn{padding-inline:6px;gap:6px}
.receipt-wrap > .btn{white-space:normal;text-align:center}

.oa-install summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;padding:6px 0}
.item .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:-4px}
.item{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.item.sel{border-color:var(--green)!important;box-shadow:0 0 0 3px var(--green-soft)}
/* guia interativo */
.tour{position:fixed;inset:0;z-index:45;pointer-events:none}
.tour.dim{background:rgba(8,16,12,.45)}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 2px var(--mustard),0 0 0 9999px rgba(8,16,12,.55);transition:left .2s,top .2s,width .2s,height .2s;pointer-events:none}
.tour-card{position:fixed;left:16px;right:16px;max-width:440px;margin-inline:auto;background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px 14px;box-shadow:0 12px 34px rgba(0,0,0,.3);pointer-events:auto;display:flex;flex-direction:column;gap:6px;transition:top .2s}
.tour-card.dock{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tour-card h3{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0}
.tour-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.tour-top{display:flex;align-items:center;justify-content:space-between}
.tour-x{border:0;background:none;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:8px;margin-right:-6px}
.tour-bar{height:3px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.tour-bar i{display:block;height:100%;background:var(--mustard)}
.tour-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ex-card{gap:10px}
.ex-head{display:flex;align-items:center;gap:12px}
.ex-head > span:last-child{display:flex;flex-direction:column;gap:1px}
.ex-icon{width:38px;height:38px;border-radius:10px;background:var(--mustard-soft);color:var(--mustard-ink);display:grid;place-items:center;flex:none}
.ex-banner .grp{display:flex;gap:6px}

/* entrar numa comanda ao vivo */
.join-icon,.lo-icon{background:var(--green-soft);color:var(--green)}
/* a caixa ocupa a linha toda; ao tocar nela, encolhe e o Entrar e o ícone de colar aparecem */
.join{--ease:cubic-bezier(.2,.8,.2,1)}
.join form{display:grid;grid-template-columns:minmax(0,1fr) 0px;column-gap:0;transition:grid-template-columns .3s var(--ease),column-gap .3s var(--ease)}
.join.open form{grid-template-columns:minmax(0,1fr) 92px;column-gap:8px}
.join-field{position:relative;display:flex;min-width:0}
.join-field input{flex:1 1 auto;min-width:0;font-family:var(--f-mono);text-transform:lowercase;transition:padding-right .3s var(--ease),border-color .15s,box-shadow .15s}
.join.open .join-field input{padding-right:46px}
.join input:placeholder-shown{font-family:var(--f-body);text-transform:none}
.join-paste{position:absolute;right:1px;top:50%;width:44px;height:44px;margin-top:-22px;border:0;background:none;padding:0;color:var(--green);display:grid;place-items:center;opacity:0;transform:scale(.5);pointer-events:none;transition:opacity .2s .1s,transform .3s .1s var(--ease)}
.join-paste svg{width:21px;height:21px}
.join-paste:active{opacity:.55}
.join.open .join-paste{opacity:1;transform:none;pointer-events:auto}
.join-go{min-width:0;overflow:hidden;padding-inline:0;opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .22s .05s,transform .3s var(--ease)}
.join.open .join-go{opacity:1;transform:none;pointer-events:auto}

/* comanda ao vivo: painel no topo da aba Comanda */
.live-panel{--lp-soft:color-mix(in srgb,var(--green-ink) 14%,transparent);--lp-line:color-mix(in srgb,var(--green-ink) 22%,transparent);
  background:var(--green);color:var(--green-ink);border-radius:18px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.lp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.lp-status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--lp-soft);border-radius:99px;padding:6px 12px 6px 10px;white-space:nowrap}
.lp-status.warn{background:var(--mustard);color:#2a1d02}
.lp-dot{position:relative;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.lp-status.on .lp-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:lp-ring 1.8s ease-out infinite}
@keyframes lp-ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion: reduce){.lp-status.on .lp-dot::after{animation:none}}
.lp-code{border:0;background:none;color:inherit;display:inline-flex;align-items:center;gap:7px;padding:6px 2px;min-height:34px;font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.1em;min-width:0}
.lp-code svg{width:17px;height:17px;opacity:.85}
.lp-online{display:flex;align-items:center;gap:12px;min-width:0}
.lp-online:empty{display:none}
.lp-avs{display:flex;flex:none;padding-left:4px}
.lp-avs .avatar{width:32px;height:32px;font-size:12.5px;margin-left:-8px;box-shadow:0 0 0 2.5px var(--green)}
.lp-more{background:var(--surface)!important;color:var(--green)!important;font-family:var(--f-mono)}
.lp-on-txt{display:flex;flex-direction:column;min-width:0}
.lp-on-txt b{font-size:15.5px;line-height:1.25}
.lp-on-txt small{font-size:13px;opacity:.82;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-msg{margin:0;font-size:14px;line-height:1.4;opacity:.92}
.lp-who{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--lp-line);padding-top:12px}
.lp-label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.live-panel .chip{background:var(--lp-soft);color:var(--green-ink);box-shadow:inset 0 0 0 1px var(--lp-line)}
.live-panel .chip[aria-pressed="true"]{background:var(--mustard);color:#2a1d02;box-shadow:none}
.lp-me{display:flex;align-items:center;gap:10px;border-top:1px solid var(--lp-line);padding-top:12px;font-size:14.5px;min-width:0}
.lp-me .avatar{box-shadow:0 0 0 2px var(--lp-line)}
.lp-me > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-link{margin-left:auto;border:0;background:var(--lp-soft);color:inherit;font-weight:600;font-size:13px;border-radius:99px;padding:0 12px;min-height:32px;flex:none}
.lp-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.lp-actions.one{grid-template-columns:1fr}
.lp-ghost{background:transparent;color:var(--green-ink);box-shadow:inset 0 0 0 1.5px var(--lp-line)}

/* código do convite */
.code-box{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border-radius:12px;padding:12px 12px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.code-val{display:flex;gap:.5em;font-family:var(--f-mono);font-weight:600;font-size:28px;letter-spacing:.12em;color:var(--ink);user-select:all;-webkit-user-select:all}
.qr-wrap.sm canvas{width:min(190px,52vw)}
.ubox{cursor:pointer;transition:box-shadow .15s,border-color .15s,opacity .15s,transform .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ubox input{-webkit-user-select:text;user-select:text}
.umem{display:flex;flex-direction:column;gap:8px}
.ubox.group .umem{background:var(--surface);border-radius:12px;padding:10px;transition:box-shadow .15s}
.ubox.group .umem.sel{box-shadow:0 0 0 2px var(--green)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 2px 0}

.mname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.mhead .pay-t{flex:none}
.mtotal{margin-left:auto;font-size:15px;white-space:nowrap}
.prows{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:10px;align-items:center;min-height:38px;font-size:13.5px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.prow:last-child{border-bottom:0}
.prow .pl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pv{color:var(--ink);font-size:13px;text-align:right;white-space:nowrap}
.prow .pc{display:flex;justify-content:flex-end}
.prow.sw{cursor:pointer}
.prow.off .pl,.prow.off .pv{color:var(--muted)}
.prow.off .pv{font-family:var(--f-body);font-size:12.5px}
.plan{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.plan .urow{border-top:0;padding-top:0}
.ubox.lifting{opacity:.4;transform:scale(.98)}

.uact .grp{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.uact .btn{padding-inline:6px;gap:6px}
.adj-in{animation:adj-in .34s cubic-bezier(.2,.8,.2,1)}
@keyframes adj-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.adj-in{animation:none}}
.ds-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}

function allocate(total, weights) {

  // grupos: quem está no mesmo grupo divide um cupom só; os responsáveis pagam pelo grupo

  ids.forEach(id => { if (!unitOf[id]) unitOf[id] = id; });
  const mk = (id, members, payers) => {
    const sum = k => members.reduce((a, m) => a + per[m][k], 0);
    const multi = members.length > 1;
    const lines = multi ? members.flatMap(m => [{ header: per[m].person.name, value: per[m].total }, ...per[m].lines]) : per[members[0]].lines;
    const svcPayers = members.filter(m => per[m].person.payService).length, cvPayers = members.filter(m => per[m].person.payCouvert).length;

  };
  const units = [];

    const uid = unitOf[id];
    if (units.some(u => u.id === uid)) return;
    const g = groups.find(x => x.id === uid);
    units.push(g ? mk(g.id, g.members, g.payers) : mk(id, [id], [id]));
  });
  const U = Object.fromEntries(units.map(u => [u.id, u]));

  // cada responsável deve uma parte igual do total do seu cupom
  const share = {}; ids.forEach(id => share[id] = 0);
  units.forEach(u => { const sh = allocate(u.total, u.payers.map(() => 1)); u.shares = {}; u.payers.forEach((pid, i) => { share[pid] += sh[i]; u.shares[pid] = sh[i]; }); });
  // quem vai pagar o local: valores personalizados primeiro; o restante fica com quem paga a conta
  // ("Uma pessoa paga") ou é dividido entre os demais na proporção da parte de cada um ("Cada um paga o seu")
  const single = d.payMode === 'single' && per[d.payer] ? d.payer : '';
  // quem está num cupom compartilhado sem pagar não tem valor próprio (vale também para dados antigos ou de outro aparelho)
  const nonPay = new Set(groups.flatMap(g => g.members.filter(m => !g.payers.includes(m))));
  const custom = {};
  Object.entries(d.custom || {}).forEach(([k, v]) => { if (per[k] && k !== single && !nonPay.has(k)) custom[k] = Math.max(0, Math.round(v) || 0); });
  const paidBy = {}, coverOf = {}; ids.forEach(id => paidBy[id] = custom[id] || 0);
  const rest = total - Object.values(custom).reduce((a, b) => a + b, 0);
  if (rest > 0) {
    if (single) paidBy[single] = rest;
    else if (d.payMode !== 'single') {
      const free = ids.filter(id => !(id in custom) && share[id] > 0);
      // quem paga menos que a sua parte pode escolher quem cobre a diferença (e fica devendo a essa pessoa)
      let left = rest;

        const gap = (x in custom) ? share[x] - custom[x] : 0;
        if (gap > 0 && free.includes(y) && x !== y && gap <= left) { coverOf[x] = y; paidBy[y] += gap; left -= gap; }
      });
      const al = allocate(left, free.map(id => share[id]));

    const v = Math.min(-left[x], left[y]);
    if (v > 0) { transfers.push({ from: x, to: y, value: v }); left[x] += v; left[y] -= v; }

  const cred = ids.filter(id => left[id] > 0).map(id => ({ id, v: left[id] })).sort((a, b) => b.v - a.v);
  const debt = ids.filter(id => left[id] < 0).map(id => ({ id, v: -left[id] })).sort((a, b) => b.v - a.v);
  for (let i = 0, j = 0; i < debt.length && j < cred.length;) {
    const v = Math.min(debt[i].v, cred[j].v);
    if (v > 0) transfers.push({ from: debt[i].id, to: cred[j].id, value: v });
    debt[i].v -= v; cred[j].v -= v;
    if (!debt[i].v) i++;
    if (!cred[j].v) j++;

  const payDiff = paidSum - total;
  units.forEach(u => { u.paid = u.members.reduce((a, m) => a + paidBy[m], 0); });
  return { per, ids, units, U, unitOf, groups, payMode: d.payMode, payer: single, itemsGross, consumoBruto, discount, consumo, nominalTotal, service, couvert, total, unassigned, incomplete, openItems, freeCount: d.items.filter(i => i.fq > 0).length, freeValue, discountAfter: after, skipped, skippedValue, payers, transfers, coverOf, paidSum, payDiff, missingPayer: d.payMode === 'single' && !single };
}

function toShared(d) {

    discount: { ...d.discount }, payMode: d.payMode, payer: d.payer || '', custom: { ...(d.custom || {}) }, cover: { ...(d.cover || {}) }, groups: clone(d.groups || []) };

  const pids = new Set(people.map(p => p.id));
  const items = Object.entries(s.items || {}).filter(([, it]) => isObj(it) && !it._del && it.name)
    .map(([id, it]) => ({ id, name: it.name, qty: it.qty || 1, price: it.price || 0, fq: Math.min(it.qty || 1, it.fq ?? (it.free ? (it.qty || 1) : 0)), mode: it.mode || (it.uneq ? 'parts' : 'equal'), lk: !!it.lk, o: it.o || 0,
      a: Object.fromEntries(Object.entries(it.a || {}).filter(([k, v]) => v > 0 && pids.has(k))) })).sort((x, y) => x.o - y.o);
  return { ...base, place: s.place || '', createdAt: s.createdAt || base.createdAt, people, items,
    service: { ...b.service, ...(s.service || {}) }, couvert: { ...b.couvert, ...(s.couvert || {}) },
    discount: { ...b.discount, ...(s.discount || {}) },
    payMode: s.payMode === 'single' ? 'single' : 'none', payer: s.payer || '', custom: Object.fromEntries(Object.entries(s.custom || {}).filter(([k, v]) => typeof v === 'number' && v >= 0 && pids.has(k))),

// patch mínimo: só as folhas que mudaram, para várias pessoas editarem ao mesmo tempo sem se sobrescrever
function diff(a, b) {
  if (isObj(a) && isObj(b)) {
    const p = {}; let any = false;
    for (const k of Object.keys(b)) { const x = diff(a[k], b[k]); if (x !== undefined) { p[k] = x; any = true; } }
    for (const k of Object.keys(a)) if (!(k in b)) { p[k] = isObj(a[k]) ? { _del: true } : null; any = true; }
    return any ? p : undefined;
  }
  return JSON.stringify(a) === JSON.stringify(b) ? undefined : (b === undefined ? null : b);
}

  async start() {

/* ---------- uso derivado do histórico (contagens sempre batem com as contas salvas) ---------- */
const placeKey = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
function usage() {
  const people = {}, products = {}, places = {};
  bills.forEach(b => {
    const pk = placeKey(b.place);
    if (pk) { const pl = places[pk] = places[pk] || { name: (b.place || '').trim(), n: 0, last: 0 }; pl.n++; if (b.closedAt > pl.last) { pl.last = b.closedAt; pl.name = b.place.trim(); } }
    new Set(b.people.map(p => norm(p.name))).forEach(k => people[k] = (people[k] || 0) + 1);
    new Set(b.items.map(i => norm(i.name))).forEach(k => products[k] = (products[k] || 0) + 1);
  });
  return { people, products, places };
}
const recentPlaces = (U = usage()) => Object.values(U.places).sort((a, b) => b.last - a.last);

/* ---------- preço por local ---------- */
function findProduct(name) { return catalog.products.find(p => norm(p.name) === norm(name)); }
function priceInfo(prod, place) {
  if (!prod) return null;
  const pk = placeKey(place), prices = prod.prices || {};
  if (pk && prices[pk]) return { price: prices[pk].price, here: true, where: prices[pk].place };
  const others = Object.values(prices).sort((a, b) => (b.last || 0) - (a.last || 0));
  if (others.length) return { price: others[0].price, here: false, where: others[0].place };
  return prod.price ? { price: prod.price, here: false, where: '' } : null;
}
function rememberPrice(name, price, place, when) {
  let k = findProduct(name);
  if (!k) { k = { name, price, prices: {}, last: when }; catalog.products.push(k); }
  k.prices = k.prices || {};
  k.price = price; k.last = when;
  const pk = placeKey(place);
  if (pk) k.prices[pk] = { place: place.trim(), price, last: when };
}

// preenche preços por local que faltam, usando as comandas já salvas (comandas antigas não guardavam o local do preço)
function backfillPrices() {
  let changed = false;
  [...bills].sort((a, b) => (a.closedAt || 0) - (b.closedAt || 0)).forEach(b => {
    const pk = placeKey(b.place); if (!pk) return;
    (b.items || []).forEach(it => {
      const k = findProduct(it.name); if (!k) return;
      k.prices = k.prices || {};
      const e = k.prices[pk];
      if (!e) { k.prices[pk] = { place: b.place.trim(), price: it.price, last: b.closedAt }; changed = true; }
      else if (!e.edited && (e.last || 0) < b.closedAt && e.price !== it.price) { e.price = it.price; e.last = b.closedAt; changed = true; }
    });
  });
  return changed;
}

// o que existe nas comandas salvas e não está nos cadastros
function historyCatalog() {
  const prods = {}, ppl = {};
  [...bills].sort((a, b) => (a.closedAt || 0) - (b.closedAt || 0)).forEach(b => {
    const pk = placeKey(b.place);
    (b.items || []).forEach(it => {
      const k = norm(it.name);
      const p = prods[k] = prods[k] || { name: it.name.trim(), price: it.price, last: 0, prices: {} };
      p.price = it.price; p.last = b.closedAt || 0; p.name = it.name.trim();
      if (pk) p.prices[pk] = { place: b.place.trim(), price: it.price, last: b.closedAt || 0 };
    });
    (b.people || []).forEach(x => { const k = norm(x.name); ppl[k] = { name: x.name.trim(), last: b.closedAt || 0 }; });
  });
  const missingProducts = Object.values(prods).filter(p => !findProduct(p.name)).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  const missingPeople = Object.values(ppl).filter(p => !catalog.people.some(x => norm(x.name) === norm(p.name))).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  return { missingProducts, missingPeople };
}
function recoverSheet() {
  const { missingProducts: mp, missingPeople: mu } = historyCatalog();
  const priceList = p => Object.values(p.prices).sort((a, b) => b.last - a.last).map(e => `${e.place} ${BRL(e.price)}`).join(' · ') || BRL(p.price);
  openSheet({ title: 'Recuperar do histórico', body: `${mp.length ? `<div class="card-head"><span class="eyebrow">Produtos (${mp.length})</span><button class="btn small ghost" data-all="rp">Marcar todos</button></div>

    ${mu.length ? `<div class="card-head"><span class="eyebrow">Pessoas (${mu.length})</span><button class="btn small ghost" data-all="ru">Marcar todos</button></div>
      <div class="rec-list">${mu.map((p, i) => `<label class="rec-row"><input type="checkbox" data-ru="${i}" checked><span><b>${esc(p.name)}</b></span></label>`).join('')}</div>` : ''}
`,
    foot: `<button class="btn ghost" id="rc-no">Cancelar</button><button class="btn" id="rc-ok">Recuperar selecionados</button>`, onMount: s => {
    $('#rc-no', s).onclick = () => closeSheet();
    $$('[data-all]', s).forEach(b => b.onclick = () => { const boxes = $$(`[data-${b.dataset.all}]`, s); const on = !boxes.every(x => x.checked); boxes.forEach(x => x.checked = on); });
    $('#rc-ok', s).onclick = () => {
      const pick = $$('[data-rp]', s).filter(x => x.checked).map(x => mp[+x.dataset.rp]);

      if (!pick.length && !pickU.length) { toast('Marque ao menos um item para recuperar.'); return; }
      pick.forEach(p => catalog.products.push(clone(p)));

    };
  } });
}

let pendingFile = null;
const fileSaver = {
  async save({ filename, data }) {
    const file = new File([data], filename, { type: data.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) {
        if (e && e.name === 'AbortError') { const x = new Error('declined'); x.code = 'declined'; throw x; }
        // o iPhone só abre o menu logo depois de um toque; se demorou, oferece um toque novo com o arquivo já pronto
        if (e && e.name === 'NotAllowedError') { pendingFile = file; const x = new Error('again'); x.code = 'again'; throw x; }
        throw e;
      }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

const slug = s => placeKey(s || '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'conta';
async function receiptCanvas(r, b, calc) {

  const disp = px => `800 ${px * S}px "Atkinson Hyperlegible Next", system-ui, sans-serif`;
  const rows = receiptRows(r, b, calc);
  // QR code do Pix logo abaixo da chave, quando o cupom tem um Pix só
  for (let i = rows.length - 1; i >= 0; i--) {

    if (q) { try { rows.splice(i + 1, 0, { t: 'qr', m: await qrMatrix(pixPayload(q.key, q.toName, q.value)), label: `Pix de ${BRL(q.value)} para ${q.toName}` }); } catch {} }
  }
  const look = {
    brand: { font: mono(600, 14), lh: 22, align: 'center' },
    center: { font: mono(400, 12.5), lh: 18, align: 'center' },
    small: { font: mono(400, 11), lh: 16, align: 'center' },
    who: { font: disp(20), lh: 30, align: 'center' },
    note: { font: mono(400, 12.5), lh: 18 },
    detail: { font: mono(400, 11), lh: 15, indent: 8 },
    foot: { font: mono(400, 11), lh: 16, align: 'center' },
    pair: { font: mono(400, 12.5), lh: 19 },
    sub: { font: mono(600, 13), lh: 20 },
    total: { font: mono(600, 16), lh: 26 },
  };
  const toneColor = () => null;
  const wrap = (ctx, text, maxW) => {
    const out = []; let cur = '';
    String(text).split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; });
    if (cur) out.push(cur); return out.length ? out : [''];

        }

      }

        if (draw) drawQR(ctx, row.m, M + (W - size) / 2, y, size, C.paper, C.ink);
        y += size + 4 * S; ctx.font = mono(400, 11);
        if (draw) { ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(row.label, M + W / 2, y + 12 * S); }
        y += 18 * S; return;
      }
      const lk = look[row.t === 'center' && row.small ? 'small' : row.t]; if (!lk) return;
      if (row.t === 'foot') y += 8 * S;
      if (row.t === 'total') { y += 6 * S; if (draw) line(ctx, M + PX, M + PX + IW, y, false, 2, C.ink); y += 4 * S; }
      ctx.font = lk.font; ctx.textBaseline = 'alphabetic';
      const color = toneColor(row.tone) || lk.color || C.ink;
      if (row.left !== undefined) {
        const rw = ctx.measureText(row.right).width;
        wrap(ctx, row.left, IW - rw - 12 * S).forEach((t, i) => {
          y += lk.lh * S;
          if (draw) {
            ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(t, M + PX, y - 4 * S);
            if (!i) { ctx.textAlign = 'right'; ctx.fillText(row.right, M + PX + IW, y - 4 * S); }
          }
        });
        return;
      }
      const ind = (lk.indent || 0) * S;
      wrap(ctx, row.text, IW - ind).forEach(t => {
        y += lk.lh * S;
        if (draw) { ctx.fillStyle = color; ctx.textAlign = lk.align === 'center' ? 'center' : 'left'; ctx.fillText(t, lk.align === 'center' ? M + W / 2 : M + PX + ind, y - 4 * S); }
      });

  };

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);

  const z = 6 * S, x0 = M, x1 = M + W, y0 = M, y1 = H - M;

  for (let x = x1; x > x0; x -= z * 2) { ctx.lineTo(x - z, y1); ctx.lineTo(Math.max(x - z * 2, x0), y1 - z); }
  ctx.closePath(); ctx.fillStyle = C.paper; ctx.fill(); ctx.restore();

}

function deleteCurrent(ask) {
  if (draft.isExample) { exitExample(); tab = 'inicio'; render(); return; }
  const d = draft;
  const inHistory = bills.some(b => b.id === d.id);
  const go = () => {
    closeSheet(); pending = {};
    if (draft.live) live.end();
    const backup = { draft: clone(draft), bill: bills.find(b => b.id === d.id) || null };
    if (backup.bill) { bills = bills.filter(b => b.id !== d.id); store.deleteBill(d.id); }
    draft = blankDraft(); tab = 'inicio'; saveDraft(); render(); window.scrollTo({ top: 0 });
    toast('Comanda excluída.', { label: 'Desfazer', run: () => {

      if (backup.bill) { bills = [backup.bill, ...bills].sort((a, b) => b.closedAt - a.closedAt); store.saveBill(backup.bill); }

    const h = now.getHours(), greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';

    <div class="hero">
      <p class="hero-greet">${greet}.</p>
      <h2 class="hero-title">Onde vai ser hoje?</h2>
      <form id="start-form" class="start-row" autocomplete="off">
        <input id="start-place" autocomplete="off" autocapitalize="words" type="text" placeholder="Nome do local" aria-label="Nome do local" data-keep>
        <button class="btn mustard" type="submit">Abrir comanda</button>
      </form>
      ${places.length ? `<div class="chips hero-chips">${places.map(p => `<button type="button" class="chip" data-start="${esc(p.name)}">${esc(p.name)}</button>`).join('')}</div>` : ''}
    </div>

    ${inProgress ? `<div class="card current">
      <div class="card-head"><div><span class="eyebrow">${d.savedAt ? 'Editando comanda salva' : 'Comanda em andamento'}</span><h2>${esc(d.place || 'Sem local')}</h2></div>
        <span class="cur-total num">${BRL(c.total)}</span></div>
      <p class="hint">${plural(d.people.length, 'pessoa', 'pessoas')} · ${plural(d.items.length, 'item', 'itens')} · aberta em ${fmtDateTime(d.createdAt)}${d.live ? ' · comanda ao vivo' : ''}</p>
      <div class="actions-bar"><button class="btn" id="go-comanda">Continuar</button>${ex ? '' : `<button class="btn ghost danger-text" id="del-current">${I.trash}Excluir comanda</button>`}</div>
    </div>` : ''}

    <div class="card ex-card" id="ex-card">
      <div class="ex-head"><span class="ex-icon">${I.receipt}</span><span><b>Comanda de exemplo</b><span class="hint">Guia com cada função do app</span></span></div>
      ${ex ? `<div class="btn-row"><button class="btn small" id="ex-continue">Continuar</button><button class="btn small ghost" id="end-example">Sair do exemplo</button></div>`
        : `<button class="btn small mustard" id="go-example">Ver exemplo</button>`}
    </div>

    ${store.db && !(d.live && inProgress) ? `<div class="card ex-card join" id="join-card">
      <div class="ex-head"><span class="ex-icon join-icon">${I.live}</span><span><b>Comanda ao vivo</b><span class="hint">Entre com o código que um amigo compartilhou e marque o que você consumiu</span></span></div>
      <form id="join-form" autocomplete="off">
        <span class="join-field"><input id="join-code" type="text" placeholder="Código ou link" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Código ou link da comanda ao vivo" data-keep>${navigator.clipboard?.readText ? `<button class="join-paste" type="button" id="join-paste" aria-label="Colar">${I.paste}</button>` : ''}</span>
        <button class="btn join-go" type="submit">Entrar</button></form>
    </div>` : ''}

    ${bills.length ? `<div class="card">
      <div class="card-head"><h2>Últimas comandas</h2><button class="btn small ghost" id="go-hist">Ver histórico</button></div>
      <div class="mini-stats"><span><b class="num">${BRL(monthTotal)}</b> gastos neste mês</span><span><b class="num">${bills.length}</b> ${bills.length === 1 ? 'comanda salva' : 'comandas salvas'}</span></div>
      <div class="hist">${bills.slice(0, 3).map(histRowHTML).join('')}</div>
    </div>` : ''}`;
  },
  bind(v) {
    const startEl = $('#start-place', v);
    attachSuggest(startEl, () => recentPlaces().map(p => ({ label: p.name, right: plural(p.n, 'vez', 'vezes'), dim: true })), () => {
      $$('[data-start]', v).forEach(x => x.setAttribute('aria-pressed', norm(x.dataset.start) === norm(startEl.value)));
    });
    $('#start-form', v).addEventListener('submit', e => {
      e.preventDefault();
      const place = startEl.value.trim().replace(/\s+/g, ' ');
      if (!place) { toast('Digite o nome do local ou toque numa sugestão.'); if (!isTouch) startEl.focus(); return; }
      document.activeElement?.blur?.(); newBillAt(place);
    });
    // a sugestão só preenche o nome; a comanda abre ao tocar em Abrir comanda
    $$('[data-start]', v).forEach(b => b.addEventListener('click', () => {
      startEl.value = b.dataset.start;
      $$('[data-start]', v).forEach(x => x.setAttribute('aria-pressed', x === b));
    }));
    startEl.addEventListener('input', () => $$('[data-start]', v).forEach(x => x.setAttribute('aria-pressed', norm(x.dataset.start) === norm(startEl.value))));
    const jCard = $('#join-card', v), jIn = $('#join-code', v);
    if (jCard) {
      const sync = () => jCard.classList.toggle('open', document.activeElement === jIn || !!jIn.value.trim());
      jIn.addEventListener('focus', sync);
      jIn.addEventListener('input', sync);
      jIn.addEventListener('blur', () => setTimeout(sync, 120));
      // tocar em Entrar ou em colar não tira o foco do campo, senão os botões somem antes do toque
      $$('.join-go, .join-paste', jCard).forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
      requestAnimationFrame(sync);
    }
    $('#join-paste', v)?.addEventListener('click', async () => {
      try { const t = (await navigator.clipboard.readText()).trim(); if (t) { $('#join-code', v).value = t; $('#join-form', v).requestSubmit(); } else toast('Nada copiado.'); }
      catch { toast('Não deu para colar. Toque e segure no campo e escolha Colar.'); }
    });
    $('#join-form', v)?.addEventListener('submit', e => {
      e.preventDefault(); document.activeElement?.blur?.();
      const raw = $('#join-code', v).value.trim().toLowerCase().replace(/\s+/g, '');
      const m = /#m([a-z0-9]{6,16})/.exec(raw) || /^([a-z0-9]{6,16})$/.exec(raw);
      if (!m) { toast('Código inválido. Ele tem 10 letras e números.'); return; }
      live.browserOk = true; // quem digita o código já está onde quer usar
      if (location.hash === '#m' + m[1]) live.boot(); else location.hash = 'm' + m[1];
    });
    $('#go-comanda', v)?.addEventListener('click', () => { exitExample(); tab = 'comanda'; render(); window.scrollTo({ top: 0 }); });
    $('#del-current', v)?.addEventListener('click', () => deleteCurrent(true));
    $('#go-example', v)?.addEventListener('click', enterExample);
    $('#ex-continue', v)?.addEventListener('click', () => { tab = 'comanda'; render(); window.scrollTo({ top: 0 }); });
    $('#end-example', v)?.addEventListener('click', () => { exitExample(); tab = 'inicio'; render(); });
    $('#go-hist', v)?.addEventListener('click', () => { tab = 'historico'; render(); window.scrollTo({ top: 0 }); });
    $$('[data-bill]', v).forEach(b => b.addEventListener('click', () => openBill(b.dataset.bill)));
  },
};
function histRowHTML(b) {
  const dt = new Date(b.closedAt);
  return `<button class="hist-row" data-bill="${b.id}">
    <span class="hist-date"><b>${String(dt.getDate()).padStart(2, '0')}</b><small>${dt.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}</small></span>
    <span style="min-width:0"><span class="hist-title" style="display:block">${esc(b.place || 'Comanda sem nome')}</span>
      <span class="hist-sub" style="display:block">${esc(b.people.map(p => p.name).join(', '))} · ${plural(b.items.length, 'item', 'itens')}</span></span>
    <span class="hist-total">${BRL(b.total)}</span>
  </button>`;
}

// alterações em itens já confirmados ficam num rascunho até tocar em Salvar
let pending = {};
function pendingFor(it) { return pending[it.id] || null; }
function stage(it) { if (!pending[it.id]) pending[it.id] = { a: { ...it.a }, qty: it.qty }; return pending[it.id]; }
function pendingDirty(it) { const p = pending[it.id]; if (!p) return false; return p.qty !== it.qty || JSON.stringify(Object.entries(p.a).filter(([, v]) => v > 0).sort()) !== JSON.stringify(Object.entries(it.a).filter(([, v]) => v > 0).sort()); }

// item selecionado: mostra Alterar e Remover
let selItem = null;
function itemCardHTML(it, d, me) {
  const ids = d.people.map(p => p.id);
  const nm = id => esc(d.people.find(p => p.id === id)?.name || '');
  const total = it.qty * it.price;
  const head = (qty) => `<div class="item-top"><div style="min-width:0"><div class="item-name">${esc(it.name)}${it.fq ? `<span class="tag">${it.fq >= qty ? 'cortesia' : it.fq + ' cortesia'}</span>` : ''}</div><div class="item-meta num">${qty} × ${BRL(it.price)}</div></div>
    <div class="item-total">${BRL(qty * it.price)}</div></div>`;
  const sel = selItem === it.id;
  const footer = `<div class="item-actions"><span class="share">${it.lk ? (it.mode === 'units' ? 'Por unidade' : 'Dividido igualmente') + ' · confirmado' : 'Novo item'}</span>
    ${sel ? `<span class="grp"><button class="btn small ghost" data-rename>${I.edit}Alterar</button><button class="btn small ghost del-btn" data-del>${I.trash}Remover</button></span>` : ''}</div>`;
  const sec = t => `<span class="sec">${t}</span>`;

  /* ----- item confirmado ----- */
  if (it.lk) {
    const p = pendingFor(it); const cur = p || { a: it.a, qty: it.qty };
    const dirty = pendingDirty(it);
    let body;
    if (it.mode === 'units') {
      body = `<div class="units">${d.people.map(pp => {
        const was = it.a[pp.id] || 0, now = cur.a[pp.id] || 0, delta = now - was;
        return `<div class="unit-row ${now ? 'on' : ''}">
          <span class="who-name">${avatar(pp.name)}<span class="${pp.id === me ? 'me-name' : ''}">${esc(pp.name)}</span></span>
          <span class="unit-count"><span class="num">${now}</span>${delta ? `<span class="delta ${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${delta}</span>` : ''}</span>
          <span class="unit-btns"><button class="minus" data-dec="${pp.id}" aria-label="Tirar uma unidade de ${esc(pp.name)}" ${now ? '' : 'disabled'}>−1</button><button class="plus" data-inc="${pp.id}" aria-label="Mais uma unidade para ${esc(pp.name)}">+1</button></span>
        </div>`; }).join('')}</div>`;
    } else {
      const who = ids.filter(id => (cur.a[id] || 0) > 0);
      body = `<div class="chips" role="group" aria-label="Quem divide ${esc(it.name)}">${d.people.map(pp => {
          const on = (cur.a[pp.id] || 0) > 0, was = (it.a[pp.id] || 0) > 0;
          return `<button class="chip ${pp.id === me ? 'me' : ''} ${on !== was ? 'changed' : ''}" data-toggle="${pp.id}" aria-pressed="${on}">${esc(pp.name)}</button>`; }).join('')}</div>
        <div class="row" style="align-items:center;justify-content:space-between">
          <span class="share">${who.length > 1 ? `Dividido por ${who.length}: <span class="num">${BRL(Math.round((cur.qty - Math.min(it.fq || 0, cur.qty)) * it.price / who.length))}</span> cada` : who.length ? 'Item individual' : '<b style="color:var(--danger)">Ninguém marcado</b>'}</span>
          <span class="unit-btns"><span class="hint">Qtd.</span><span class="num" style="min-width:22px;text-align:center;font-weight:600">${cur.qty}</span>${cur.qty !== it.qty ? `<span class="delta ${cur.qty > it.qty ? 'up' : 'down'}">${cur.qty > it.qty ? '+' : ''}${cur.qty - it.qty}</span>` : ''}
            <button class="minus" data-qdec ${cur.qty > 1 ? '' : 'disabled'} aria-label="Uma unidade a menos">−1</button><button class="plus" data-qinc aria-label="Mais uma unidade">+1</button></span>
        </div>`;
    }
    let save = '';
    if (dirty) {
      const dq = cur.qty - it.qty;
      const valid = it.mode === 'units' ? cur.qty > 0 : ids.some(id => (cur.a[id] || 0) > 0);
      save = `<div class="pending-bar">
        <span><b>Alteração não salva</b>${dq ? ` · ${dq > 0 ? '+' : ''}${plural(dq, 'unidade', 'unidades')} · ${dq > 0 ? '+' : '−'}${BRL(Math.abs(dq) * it.price)}` : ''}</span>
        <span class="grp"><button class="btn small ghost" data-discard>Descartar</button><button class="btn small" data-save ${valid ? '' : 'disabled'}>${I.save}Salvar</button></span>
      </div>`;
    }
    return `<div class="item locked ${dirty ? 'dirty' : ''} ${sel ? 'sel' : ''}" data-item="${it.id}">
      ${head(cur.qty)}${sec(it.mode === 'units' ? 'Unidades de cada um' : 'Quem consumiu')}${body}${save}${footer}</div>`;
  }

  /* ----- item novo: primeira divisão ----- */
  const who = ids.filter(id => (it.a[id] || 0) > 0); const n = who.length;
  const units = who.reduce((s, id) => s + (it.a[id] || 0), 0);
  const ok = it.mode === 'units' ? (n > 0 && units === it.qty) : n > 0;
  const seg = `<div class="seg" role="group" aria-label="Como dividir ${esc(it.name)}">
    <button data-mode="equal" aria-pressed="${it.mode === 'equal'}">Igual</button>
    <button data-mode="units" aria-pressed="${it.mode === 'units'}">Por unidade</button></div>`;
  let body = '';
  if (it.mode === 'units') {
    const left = it.qty - units;
    body = `<div class="units">${d.people.map(p => { const u = it.a[p.id] || 0; return `
      <div class="unit-row ${u ? 'on' : ''}">
        <span class="who-name">${avatar(p.name)}<span class="${p.id === me ? 'me-name' : ''}">${esc(p.name)}</span></span>
        <span class="unit-count"><span class="num">${u}</span></span>
        <span class="unit-btns"><button class="minus" data-unit="${p.id}" data-dir="-1" aria-label="Uma unidade a menos para ${esc(p.name)}" ${u ? '' : 'disabled'}>−1</button><button class="plus" data-unit="${p.id}" data-dir="1" aria-label="Uma unidade a mais para ${esc(p.name)}" ${left > 0 ? '' : 'disabled'}>+1</button></span>
      </div>`; }).join('')}</div>
      ${left === 0 ? `<div class="status ok">${I.ok}<span><b>${it.qty} de ${it.qty} distribuídas.</b> Já pode confirmar.</span></div>`
        : left > 0 ? `<div class="status warn">${I.warn}<span><b>Faltam ${plural(left, 'unidade', 'unidades')}</b> (${units} de ${it.qty} distribuídas).</span></div>`
        : `<div class="status bad">${I.warn}<span><b>${plural(-left, 'unidade', 'unidades')} a mais</b> (${units} de ${it.qty}).</span></div>`}`;
  } else {
    const all = n === ids.length && n > 0;
    body = `${d.people.length ? `<div class="chips" role="group" aria-label="Quem consumiu ${esc(it.name)}">
        ${d.people.map(p => `<button class="chip ${p.id === me ? 'me' : ''}" data-toggle="${p.id}" aria-pressed="${(it.a[p.id] || 0) > 0}">${esc(p.name)}</button>`).join('')}
        ${d.people.length > 1 ? `<button class="chip all" data-all="${all ? 'none' : 'all'}">${all ? 'Ninguém' : 'Todos'}</button>` : ''}
      </div>` : ''}
      <span class="share">${!n ? '<b style="color:var(--danger)">Toque em quem consumiu.</b>' : n === 1 ? 'Item individual' : `Dividido por ${n}: <span class="num">${BRL(Math.round((it.qty - Math.min(it.fq || 0, it.qty)) * it.price / n))}</span> cada`}</span>`;
  }
  return `<div class="item open ${sel ? 'sel' : ''}" data-item="${it.id}">
    ${head(it.qty)}
    ${d.people.length > 1 ? sec('Como dividir') + seg : ''}
    ${d.people.length ? sec(it.mode === 'units' ? 'Unidades de cada um' : 'Quem consumiu') : ''}
    ${body}
    <div class="row" style="align-items:center;gap:10px"><span class="hint">Quantidade</span>
      <span class="stepper sm"><button data-q="-1" aria-label="Diminuir quantidade" ${it.qty > 1 ? '' : 'disabled'}>−</button><span class="num">${it.qty}</span><button data-q="1" aria-label="Aumentar quantidade">+</button></span></div>
    <button class="btn" data-confirm ${ok ? '' : 'disabled'}>${I.lock}Confirmar divisão</button>
    ${footer}
  </div>`;
}

function renameSheet(it) {
  openSheet({ title: `Alterar ${it.name}`, body: `<form id="rn-form" style="display:flex;flex-direction:column;gap:12px" autocomplete="off">
      <div class="field"><label for="rn-name">Nome do produto</label><input id="rn-name" type="text" value="${esc(it.name)}"></div>
      <div class="field"><label for="rn-price">Valor unitário (R$)</label><input id="rn-price" type="text" inputmode="numeric" data-money value="${moneyInput(it.price)}"></div>
    </form>`, foot: `<button type="button" class="btn ghost" id="rn-no">Cancelar</button><button type="submit" form="rn-form" class="btn">${I.save}Salvar alteração</button>`, onMount: s => {
    $('#rn-no', s).onclick = () => closeSheet();
    $('#rn-name', s).focus();
    $('#rn-form', s).addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#rn-name', s).value.trim().replace(/\s+/g, ' ');
      const price = parseMoney($('#rn-price', s).value);
      if (!name) { toast('Informe o nome do produto.'); return; }
      if (price === null || price === 0) { toast('Informe o valor unitário (por exemplo, 12,90).'); return; }
      const cur = draft.items.find(x => x.id === it.id); if (!cur) { closeSheet(true); return; }
      const changed = cur.name !== name || cur.price !== price;
      cur.name = name; cur.price = price; closeSheet(true);
      if (changed) { commit(); toast('Item alterado.'); }
    });
  } });
}

          <div class="field"><label for="item-qty">Quantidade</label>
            <div class="stepper"><button type="button" data-step="-1" aria-label="Menos">−</button><input id="item-qty" type="number" min="1" step="1" inputmode="numeric" value="1" data-keep><button type="button" data-step="1" aria-label="Mais">+</button></div></div>
          <div class="field grow"><label for="item-price">Valor unitário (R$)</label><input id="item-price" type="text" inputmode="numeric" data-money placeholder="R$ 0,00" value="" data-keep></div>

    </div>

    ${d.live ? '' : liveCardHTML()}

    ${!d.isExample && (d.items.length || d.people.length || d.place) ? `<button class="btn ghost reset-btn" id="reset">${I.refresh}Limpar ou excluir comanda</button>` : ''}`;
  },
  bind(v) {
    const d = draft;
    $('#clear-example', v)?.addEventListener('click', () => { exitExample(); tab = 'inicio'; render(); window.scrollTo({ top: 0 }); });
    $('#ex-guide', v)?.addEventListener('click', () => tour.start());
    $('#reset', v)?.addEventListener('click', resetSheet);
    $('#new-bill-top', v)?.addEventListener('click', () => { pending = {}; draft = blankDraft(); tab = 'inicio'; saveDraft(); render(); window.scrollTo({ top: 0 }); });
    const addPerson = name => {
      name = name.trim().replace(/\s+/g, ' ');
      if (!name) return;
      if (d.people.some(p => norm(p.name) === norm(name))) { toast(`${name} já está na comanda.`); return; }
      const p = newPerson(name);
      const prevCount = d.people.length;
      d.people.push(p);
      // só entra automaticamente em itens ainda abertos e divididos igual entre todos; itens confirmados não mudam
      d.items.forEach(it => { if (!it.lk && it.mode === 'equal' && prevCount && Object.keys(it.a).filter(k => it.a[k] > 0).length === prevCount) it.a[p.id] = 1; });
      const inp = $('#person-name'); if (inp) inp.value = '';
      commit(); afterSubmit('#person-name');
    };
    $('#place', v).addEventListener('change', e => { d.place = e.target.value.trim(); commit(); });
    attachSuggest($('#place', v), () => recentPlaces().map(p => ({ label: p.name })), x => { if (d.place !== x.label) { d.place = x.label; commit(); } });

function saveBill() {
  const d = draft, c = compute(d);
  if (d.isExample) { toast('No exemplo, nada é salvo no histórico.'); return; }
  if (c.unassigned.length || c.incomplete.length) { toast('Acerte a divisão de todos os itens antes de salvar.'); return; }
  if (d.items.some(pendingDirty)) { toast('Há itens com alterações não salvas. Salve ou descarte antes de continuar.'); return; }
  if (c.openItems.length) { toast(`Confirme a divisão de ${plural(c.openItems.length, 'item', 'itens')} antes de salvar.`); return; }
  if (c.missingPayer) { toast('Escolha quem vai pagar a conta em Pagamento antes de salvar.'); return; }
  if (c.payDiff !== 0) { toast(`Os valores personalizados ${c.payDiff > 0 ? 'passam' : 'ficam'} ${BRL(Math.abs(c.payDiff))} ${c.payDiff > 0 ? 'do' : 'abaixo do'} total. Ajuste antes de salvar.`); return; }
  const firstSave = !bills.some(b => b.id === d.id);
  const now = Date.now();
  d.savedAt = now;
  const { live: _l, isExample: _e, ...rest } = d;
  const bill = clone({ ...rest, closedAt: firstSave ? now : (bills.find(b => b.id === d.id)?.closedAt || now), total: c.total });
  bills = [bill, ...bills.filter(b => b.id !== bill.id)].sort((a, b) => b.closedAt - a.closedAt);
  d.people.forEach(p => {
    const k = catalog.people.find(x => norm(x.name) === norm(p.name));
    if (k) k.last = now; else catalog.people.push({ name: p.name, last: now });
  });
  d.items.forEach(it => rememberPrice(it.name, it.price, d.place, now));
  store.saveCatalog(); store.saveBill(bill);
  if (draft.live) live.end();
  pending = {};
  draft = blankDraft(); tab = 'inicio';
  saveDraft(); render(); window.scrollTo({ top: 0 });
  toast(firstSave ? 'Comanda salva no histórico e encerrada.' : 'Comanda atualizada no histórico.');
}
