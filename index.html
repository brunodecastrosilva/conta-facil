function statsHTML() {
  const meName = catalog.me || '';
  const rows = bills.map(b => { const c = compute(b); const mp = b.people.find(p => norm(p.name) === norm(meName)); return { b, c, mine: mp ? c.per[mp.id].total : null }; });
  const mineRows = rows.filter(r => r.mine !== null);
  const useMine = !!meName;
  const total = rows.reduce((a, r) => a + r.c.total, 0);
  const mineTotal = mineRows.reduce((a, r) => a + r.mine, 0);
  // últimos 6 meses
  const now = new Date(); const months = [];
  for (let k = 5; k >= 0; k--) { const dt = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push({ y: dt.getFullYear(), m: dt.getMonth(), v: 0, n: 0, label: dt.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') }); }
  rows.forEach(r => { const dt = new Date(r.b.closedAt); const mo = months.find(x => x.y === dt.getFullYear() && x.m === dt.getMonth()); if (mo) { const v = useMine ? r.mine : r.c.total; if (v !== null) { mo.v += v; mo.n++; } } });
  const max = Math.max(...months.map(m => m.v), 1);
  const maxIdx = months.reduce((bi, m, i, arr) => m.v > arr[bi].v ? i : bi, 0);
  // rankings
  const places = {}; rows.forEach(r => { const k = (r.b.place || 'Sem nome').trim(); const key = norm(k); places[key] = places[key] || { name: k, n: 0, v: 0 }; places[key].n++; places[key].v += useMine ? (r.mine || 0) : r.c.total; });
  const topPlaces = Object.values(places).sort((a, b) => b.n - a.n || b.v - a.v).slice(0, 5);
  const friends = {}; (useMine ? mineRows : rows).forEach(r => r.b.people.forEach(p => { if (norm(p.name) === norm(meName)) return; const key = norm(p.name); friends[key] = friends[key] || { name: p.name, n: 0 }; friends[key].n++; }));
  const topFriends = Object.values(friends).sort((a, b) => b.n - a.n).slice(0, 5);
  const prods = {}; rows.forEach(r => r.b.items.forEach(it => { const key = norm(it.name); prods[key] = prods[key] || { name: it.name, q: 0 }; prods[key].q += it.qty; }));
  const topProds = Object.values(prods).sort((a, b) => b.q - a.q).slice(0, 5);
  const rank = (list, val, fmt, avatars) => { const mx = Math.max(...list.map(val), 1); return list.length ? `<div class="rank">${list.map(x => `<div class="rank-row"><span class="nm">${avatars ? avatar(x.name) : ''}<span>${esc(x.name)}</span></span><span class="vl">${fmt(x)}</span><div class="track2"><div class="fill" style="width:${Math.round(val(x) / mx * 100)}%"></div></div></div>`).join('')}</div>` : '<p class="hint">Sem dados ainda.</p>'; };
  const avg = useMine ? (mineRows.length ? Math.round(mineTotal / mineRows.length) : 0) : Math.round(total / rows.length);
  return `<div class="card">
    <div class="card-head"><h2>Resumo</h2>
      <span class="me-pick"><label class="hint" for="me-select">Mostrar gastos de</label><select id="me-select"><option value="">Todas as pessoas</option>${catalog.people.map(p => `<option value="${esc(p.name)}" ${norm(p.name) === norm(meName) ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></span></div>
    <div class="stats-tiles">
      <div class="sum"><span class="eyebrow">Comandas</span><b>${useMine ? mineRows.length : rows.length}</b></div>
      <div class="sum"><span class="eyebrow">${useMine ? 'Gasto de ' + esc(meName.split(' ')[0]) : 'Gasto total'}</span><b>${BRL(useMine ? mineTotal : total)}</b></div>
      <div class="sum"><span class="eyebrow">Média por comanda</span><b>${BRL(avg)}</b></div>
      <div class="sum"><span class="eyebrow">Este mês</span><b>${BRL(months[5].v)}</b></div>
    </div>
    <div>
      <span class="eyebrow">${useMine ? 'Gasto de ' + esc(meName.split(' ')[0]) : 'Gasto total'} nos últimos 6 meses</span>
      <div class="chart" role="img" aria-label="Gasto por mês">${months.map((m, i) => `
        <div class="bar-col" tabindex="0">
          ${(i === maxIdx || i === 5) && m.v > 0 ? `<span class="bar-val" style="bottom:${Math.max(2, m.v / max * 100)}%">${BRL(m.v).replace(/,\d\d$/, '')}</span>` : ''}
          <span class="bar-tip">${m.label}: ${BRL(m.v)} · ${plural(m.n, 'comanda', 'comandas')}</span>
          <div class="bar ${m.v ? '' : 'zero'}" style="height:${m.v ? Math.max(2, m.v / max * 100) : 1}%"></div>
        </div>`).join('')}</div>
      <div class="chart-x">${months.map(m => `<span>${m.label}</span>`).join('')}</div>
    </div>
  </div>
  <div class="two-col">
    <div class="card"><h2>Locais mais frequentes</h2>${rank(topPlaces, x => x.n, x => `${plural(x.n, 'vez', 'vezes')} · ${BRL(x.v)}`)}</div>
    <div class="card"><h2>${useMine ? 'Com quem ' + esc(meName.split(' ')[0]) + ' mais sai' : 'Quem mais aparece'}</h2>${rank(topFriends, x => x.n, x => plural(x.n, 'comanda', 'comandas'), true)}</div>
    <div class="card"><h2>Mais pedidos</h2>${rank(topProds, x => x.q, x => plural(x.q, 'unidade', 'unidades'))}</div>
  </div>`;
}

      produto: [{ id: 'comandas', titulo: 'Comandas', icone: ICONE_COMANDA, resumo: 'Comanda ao vivo, guia e cadastros',
        html: `<div class="kf-bloco"><h3>Comanda ao vivo</h3><p class="kf-texto">${esc(vivo)}</p>
            <p class="kf-ajuda">Na comanda ao vivo, cada pessoa marca o que consumiu pelo próprio celular. O local, os nomes, os pedidos e os valores ficam no Firebase (Google) enquanto a comanda existe. Para começar, abra uma comanda e toque em Compartilhar com a turma.</p></div>
          <div class="kf-bloco"><h3>Guia do app</h3><p class="kf-ajuda">Uma comanda de exemplo mostra cada função, passo a passo. Nada do exemplo é salvo.</p><button type="button" class="kf-btn kf-sec" id="aj-exemplo">Ver a comanda de exemplo</button></div>
          <div class="kf-bloco"><h3>Cadastros</h3><p class="kf-ajuda">Pessoas, chaves Pix e o preço de cada produto em cada local ficam na aba Cadastros.</p><button type="button" class="kf-btn kf-sec" id="aj-cadastros">Abrir Cadastros</button></div>` }],
    });
  },
  bind(v) {
    KitFacil.ajustes.ligar(v);
    $('#aj-me', v)?.addEventListener('change', e => { catalog.me = e.target.value; store.saveCatalog(); KitFacil.ajustes.resumo('conta', catalog.me ? `Você é ${catalog.me}` : 'Sem cadastro · dados neste aparelho'); toast(catalog.me ? `Pronto: você é ${catalog.me}.` : 'Nome desmarcado.'); });
    $('#aj-exemplo', v)?.addEventListener('click', () => { sairDosAjustes(); exitExample(); enterExample(); });
    $('#aj-cadastros', v)?.addEventListener('click', () => { sairDosAjustes(); tab = 'cadastros'; render(); window.scrollTo({ top: 0 }); });
  },
};

/* ---------- guia interativo (só na comanda de exemplo) ---------- */
const TOUR = [
  { tab: 'inicio', sel: '#start-form', t: 'Abrir uma comanda', d: 'Digite o nome do bar ou restaurante e toque em Abrir comanda. Os lugares onde você já foi aparecem como atalhos.' },
  { tab: 'inicio', sel: '.join', skip: true, t: 'Entrar numa comanda ao vivo', d: 'Quando alguém da turma compartilhar a comanda ao vivo, toque na caixa e cole o código ou o link que recebeu. Assim você marca o que consumiu pelo seu celular.' },
  { tab: 'comanda', sel: '#people-card', t: 'Pessoas na mesa', d: 'Adicione quem está dividindo a conta. Nomes que você já usou aparecem como sugestão, e o valor ao lado de cada um é o consumo até agora.' },
  { tab: 'comanda', sel: '#item-card', t: 'Lançar um pedido', d: 'Informe produto, quantidade e preço da unidade. O app lembra o preço de cada produto em cada lugar e preenche sozinho na próxima vez.' },
  { tab: 'comanda', sel: '.item.open', alt: '.items > .item:last-child', t: 'Dividir um item', d: 'Todo item novo chega marcado para todos. Em Como dividir, escolha Igual ou Por unidade, quando cada um pediu uma quantidade diferente. Toque nos nomes para tirar ou incluir alguém e depois em Confirmar divisão. Experimente!' },

  { tab: 'comanda', sel: '#live-offer', alt: '#live-card', skip: true, t: 'Comanda ao vivo', d: 'Compartilhe a comanda com a turma: cada um marca o que consumiu pelo próprio celular e todos veem as mudanças na hora. Quem está na mesa lê o QR code; para os outros, mande o convite no grupo.' },
  { tab: 'comanda', sel: '#go-close', t: 'Hora de pagar', d: 'Toque em Fechar a comanda para ver quanto cada um deve.' },
  { tab: 'fechar', sel: '.sum-grid', t: 'Resumo da conta', d: 'Consumo, serviço, ajustes e o total. Confira se o total bate com a conta do lugar.' },
  { tab: 'fechar', sel: '#svc-card', t: 'Taxa de serviço', d: 'Escolha 10%, outro percentual ou um valor fixo. Se alguém não paga o serviço, decida se a taxa diminui ou é redistribuída entre os demais.' },
  { tab: 'fechar', sel: '#fq-card', skip: true, t: 'Cortesia', d: 'Informe quantas unidades o lugar não cobrou. O desconto sai da parte de quem consumiu aquele produto.' },
  { tab: 'fechar', sel: '.adj', skip: true, t: 'Couvert e desconto', d: 'Inclua couvert artístico por pessoa e descontos em reais ou em porcentagem, antes ou depois do serviço.' },
  { tab: 'fechar', sel: '#groups-card .seg', t: 'Quem paga a conta', d: 'Cada um paga a sua parte, ou uma pessoa paga tudo e os outros acertam com ela depois.' },
  { tab: 'fechar', sel: '.ubox', t: 'Quanto cada um paga', d: 'Toque numa pessoa para ela pagar outro valor ou juntar com alguém num cupom só. Para juntar mais rápido, segure o cartão e arraste sobre o de outra pessoa. Desligue Serviço de quem não deve pagar.' },
  { tab: 'fechar', sel: '.pix-btn', skip: true, t: 'Pagar com Pix', d: 'O app gera o Pix copia e cola e o QR code já com o valor certo. A chave de quem recebe fica salva no cadastro da pessoa.' },
  { tab: 'fechar', sel: '.receipt-wrap', t: 'Cupons', d: 'Cada pessoa recebe um cupom com o que consumiu. Compartilhe como imagem, PDF ou texto.' },
  { tab: 'fechar', sel: '#save-bill', t: 'Salvar e encerrar', d: 'Guarda a comanda no histórico e deixa o app pronto para a próxima. No exemplo, nada é salvo.' },
  { tab: 'historico', sel: '[data-tab="historico"]', t: 'Histórico', d: 'Suas comandas salvas, o gasto por mês, os lugares mais frequentes e com quem você mais sai. Dá para reabrir, editar ou repetir uma comanda antiga.' },
  { tab: 'cadastros', sel: '[data-tab="cadastros"]', t: 'Cadastros', d: 'Pessoas, chaves Pix e o preço de cada produto em cada lugar, usados para preencher tudo mais rápido.' },
  { tab: 'inicio', sel: '#ex-card', t: 'Pronto!', d: 'Você pode rever este guia quando quiser pela comanda de exemplo. Toque em Sair do exemplo para começar a sua.' },
];
const tour = {
  i: -1, el: null, bound: false, raf: 0, watchId: 0, lastKey: '',
  active() { return this.i >= 0 && !!this.el; },
  start(at = 0) { if (!draft.isExample) return; this.mount(); this.show(at, 1); this.watch(); },
  stop() { this.i = -1; cancelAnimationFrame(this.watchId); this.watchId = 0; if (this.el) { this.el.remove(); this.el = null; } },
  // o destaque acompanha o que muda de lugar depois de aberto (fontes que terminam de carregar, cartões que aparecem)
  watch() {
    cancelAnimationFrame(this.watchId); this.lastKey = '';
    const tick = () => {
      if (!this.active()) return;
      const st = TOUR[this.i], t = st && tab === st.tab ? this.target(st) : null, r = t && t.getBoundingClientRect();
      const key = (r ? [r.left, r.top, r.width, r.height].map(Math.round).join() : '-') + '|' + window.innerHeight + '|' + ($('.tour-card', this.el)?.offsetHeight || 0);
      if (key !== this.lastKey) { this.lastKey = key; this.place(); }
      this.watchId = requestAnimationFrame(tick);
    };
    this.watchId = requestAnimationFrame(tick);
  },
  mount() {
    if (this.el) return;
    const el = document.createElement('div'); el.className = 'tour';
    el.innerHTML = '<div class="tour-hole" hidden></div><div class="tour-card" role="dialog" aria-modal="false" aria-label="Guia"></div>';
    document.body.appendChild(el); this.el = el;
    if (!this.bound) {
      this.bound = true;
      const again = () => { if (this.active()) { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(() => this.place()); } };
      window.addEventListener('scroll', again, { passive: true });
      window.addEventListener('resize', again);
    }
  },
  target(st) { const vis = q => q && $$(q).find(el => el.getClientRects().length); return (st && (vis(st.sel) || (st.alt && vis(st.alt)))) || null; },
  show(n, dir) {
    if (!draft.isExample) return this.stop();
    // passos que não existem nesta tela (sem internet, sem cortesia…) são pulados
    while (n >= 0 && n < TOUR.length) {
      const st = TOUR[n];
      if (st.tab && tab !== st.tab) { tab = st.tab; closeSheet(); render(); }
      if (this.target(st) || !st.skip) break;
      n += dir;
    }
    if (n < 0) n = 0;
    if (n >= TOUR.length) return this.stop();
    this.i = n;
    const st = TOUR[n], last = n === TOUR.length - 1;
    $('.tour-card', this.el).innerHTML = `<div class="tour-top"><span class="eyebrow">Guia · ${n + 1} de ${TOUR.length}</span><button class="tour-x" aria-label="Fechar guia">${I.x}</button></div>
      <div class="tour-bar"><i style="width:${Math.round((n + 1) / TOUR.length * 100)}%"></i></div>
      <h3>${esc(st.t)}</h3><p>${esc(st.d)}</p>
      <div class="tour-act">${n ? '<button class="btn small ghost" data-tour="-1">Voltar</button>' : '<span></span>'}<button class="btn small" data-tour="1">${last ? 'Concluir' : 'Próximo'}</button></div>`;
    $('.tour-x', this.el).onclick = () => this.stop();
    $$('[data-tour]', this.el).forEach(b => b.onclick = () => { const d = +b.dataset.tour; if (d > 0 && last) return this.stop(); this.show(this.i + d, d); });
    const t = this.target(st);
    if (t) {
      const r = t.getBoundingClientRect(), vh = window.innerHeight;
      // rola só o necessário: o destaque fica na parte de cima e o cartão do guia embaixo
      const want = Math.max(80, Math.min(vh * .18, vh - r.height - 230));
      window.scrollTo({ top: Math.max(0, window.scrollY + r.top - want) });
    }
    this.place();
    setTimeout(() => this.place(), 400);
  },
  place() {
    if (!this.active()) return;
    const st = TOUR[this.i], hole = $('.tour-hole', this.el), card = $('.tour-card', this.el);
    const t = st && tab === st.tab ? this.target(st) : null;
    const vh = window.innerHeight, ch = card.offsetHeight, gap = 12, pad = 6;
    let top;
    if (t) {
      const r = t.getBoundingClientRect();
      // o destaque não passa por baixo da barra de abas fixa no topo
      // o destaque não passa por baixo da barra superior nem da navegação de baixo (a não ser que seja nelas)
      const barra = $('#barra'), baixo = $('.kf-nav'), naNav = !!(baixo && baixo.contains(t));
      const navB = barra ? barra.getBoundingClientRect().bottom + 2 : 4;
      const fundo = baixo && baixo.getClientRects().length && !naNav ? baixo.getBoundingClientRect().top - 2 : vh - 4;
      const y1 = Math.max(r.top - pad, naNav ? 4 : navB), y2 = Math.min(r.bottom + pad, fundo);
      hole.hidden = y2 - y1 < 8;
      Object.assign(hole.style, { left: (r.left - pad) + 'px', top: y1 + 'px', width: (r.width + pad * 2) + 'px', height: Math.max(0, y2 - y1) + 'px' });
      // fora da tela (a pessoa rolou): o cartão fica embaixo
      if (!hole.hidden && y2 + gap + ch <= fundo - gap) top = y2 + gap;
      else if (!hole.hidden && y1 - gap - ch >= navB) top = y1 - gap - ch;
    } else hole.hidden = true;
    if (top === undefined) { card.style.top = ''; card.classList.add('dock'); }
    else { card.classList.remove('dock'); card.style.top = top + 'px'; }
    this.el.classList.toggle('dim', !t || hole.hidden);
  },
};

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
